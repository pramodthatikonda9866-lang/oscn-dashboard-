{% extends "base.html" %}

{% block title %}Register - University Library System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span style="font-size: 2.2rem;">📝</span>
            <h2>Student Registration</h2>
            <p>Create your university library account</p>
        </div>

        <div class="auth-body">
            <form action="{{ url_for('register_page') }}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="regName">Full Name</label>
                    <input type="text" id="regName" name="name" class="form-control" required placeholder="John Doe" value="{{ name or '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regEmail">University Email</label>
                    <input type="email" id="regEmail" name="email" class="form-control" required placeholder="john@university.edu" value="{{ email or '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Password (Min. 6 characters)</label>
                    <input type="password" id="regPassword" name="password" class="form-control" required minlength="6" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label class="form-label" for="regConfirm">Confirm Password</label>
                    <input type="password" id="regConfirm" name="confirm_password" class="form-control" required minlength="6" placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
                    Create Account
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
                <span>Already have an account? </span>
                <a href="{{ url_for('login_page') }}" style="font-weight: 600;">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
